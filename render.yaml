services:
  # Backend FastAPI Web Service
  - type: web
    name: quoteflow-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DEFAULT_MODEL_PROVIDER
        value: "groq"
      - key: QUOTEFLOW_SEED
        value: "0"
      - key: OLLAMA_MODEL
        value: "gemma3:4b"
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: GROQ_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PRIORLABS_TABPFN_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: TIGER_DATA_CONNECTION_STRING
        sync: false
      - key: EMBEDDING_MODE
        value: "local"
      - key: FOLLOWUP_CHECKIN_SECONDS
        value: "259200"
      - key: FOLLOWUP_EXPIRY_SECONDS
        value: "604800"

  # Frontend Static Site (no region/plan — Render forbids them on static sites)
  - type: web
    name: quoteflow-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # After first deploy, set this to https://<your-backend-service>.onrender.com/api
      - key: VITE_API_BASE
        sync: false
      # Optional: direct .exe from GitHub Release (see DOWNLOAD_URL.md)
      - key: VITE_DOWNLOAD_URL
        sync: false
      - key: VITE_RELEASES_URL
        value: "https://github.com/Mavros-Lykos/QuoteFlow/releases/latest"
