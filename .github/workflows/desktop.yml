name: Desktop Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build web (typecheck + vite)
        run: npm run build

      - name: Build Tauri (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: QuoteFlow ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            Windows installer for QuoteFlow.
            Early builds may be unsigned — SmartScreen can warn.
            Set site VITE_DOWNLOAD_URL to the release asset URL.

      - name: Upload NSIS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quoteflow-windows-nsis
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
