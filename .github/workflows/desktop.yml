# Builds the Windows NSIS installer (QuoteFlow desktop).
#
# - Push/PR to main: build + upload CI artifact (for testing)
# - Tag v*: create a GitHub Release with the .exe attached
#
# After a release exists, set Render frontend:
#   VITE_DOWNLOAD_URL=https://github.com/OWNER/REPO/releases/download/v0.1.0/QuoteFlow_0.1.0_x64-setup.exe
# (exact .exe name is listed on the Release page — copy "Download" link)

name: Desktop Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build web (typecheck + vite)
        run: npm run build

      - name: Build Tauri installer (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          # Only create a Release when this run was triggered by a tag (v0.1.0, etc.)
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: QuoteFlow ${{ github.ref_name }}
          releaseDraft: false
          releasePrerelease: false
          releaseBody: |
            ## QuoteFlow for Windows

            1. Download the `.exe` installer below (NSIS setup).
            2. Run it. If SmartScreen warns (unsigned build): **More info** → **Run anyway**.
            3. First launch → Preparing → Welcome → create an estimate.

            ### Point the website download button here

            After this release is published, set on **Render → quoteflow-frontend → Environment**:

            ```
            VITE_DOWNLOAD_URL=<right-click the .exe asset → Copy link address>
            ```

            Then **Manual Deploy** the frontend (Vite bakes the URL in at build time).

            Or use the releases page: `https://github.com/${{ github.repository }}/releases/latest`

      - name: Upload NSIS artifact (every run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quoteflow-windows-nsis
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Print download URL hint
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          Write-Host ""
          Write-Host "Release page: https://github.com/$repo/releases/tag/$tag"
          Write-Host "Latest page:  https://github.com/$repo/releases/latest"
          Write-Host ""
          Write-Host "Copy the NSIS .exe download link from the Release assets,"
          Write-Host "then set VITE_DOWNLOAD_URL on Render frontend and redeploy."
